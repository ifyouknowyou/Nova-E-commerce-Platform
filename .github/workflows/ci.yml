name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova_dev_password
          POSTGRES_DB: nova_commerce
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://nova:nova_dev_password@localhost:5432/nova_commerce?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_replace_in_prod_0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci_refresh_secret_replace_in_prod_0123456789abcdef0123456789abcdef
      CORS_ORIGIN: http://localhost:3000
      WEB_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: nova-media
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: x
      S3_FORCE_PATH_STYLE: "true"
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd packages/db && npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -w @nova/api

      - name: Database (migrate + seed)
        run: |
          cd packages/db
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: E2E tests
        run: cd apps/api && npm run test:e2e

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Verify both production images build on a clean checkout (catches the
      # workspace-dep / public-dir / NEXT_PUBLIC build-arg regressions).
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t nova-api:test .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t nova-web:test .
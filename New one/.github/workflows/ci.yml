name: NEXUS OS — verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Lint · typecheck · unit · e2e · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus_migrate
          POSTGRES_PASSWORD: nexus_dev_password
          POSTGRES_DB: nexus_os
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nexus_migrate -d nexus_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus_app:nexus_dev_password@localhost:5433/nexus_os?schema=public
      DATABASE_MIGRATE_URL: postgresql://nexus_migrate:nexus_dev_password@localhost:5433/nexus_os?schema=public
      # Leave blank so the AI layer uses the deterministic engine in CI.
      ANTHROPIC_API_KEY: ''
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The verify script is the per-phase gate (Phase 7 §35): it brings the DB
      # up (already up via the service), applies RLS bootstrap + migrate + seed,
      # runs typecheck/lint/unit/e2e/build, boots the API, health-checks it, and
      # asserts Three.js stays out of the shared main bundle.
      - name: Run ./scripts/verify-phase.sh
        run: |
          chmod +x scripts/verify-phase.sh
          SKIP_DB_UP=1 ./scripts/verify-phase.sh
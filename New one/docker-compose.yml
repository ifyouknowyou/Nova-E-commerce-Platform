name: nexus-os

services:
  postgres:
    # NEXUS OS PostgreSQL. Host port 5433 — the existing NOVA stack binds 5432,
    # so NEXUS exposes 5433 to allow both sandboxes to run side by side.
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus_migrate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password}
      POSTGRES_DB: nexus_os
    ports:
      - "5433:5432"
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_migrate -d nexus_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexus_postgres_data:
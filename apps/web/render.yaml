services:
  - type: web
    name: nova-commerce
    env: node
    buildCommand: npm install && npm run build -w @nova/shared && npm run build -w @nova/web
    startCommand: cd .next/standalone && cp -r ../.next/static ./apps/web/.next/static && node apps/web/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /
    regions:
      - oregon
      - ohio

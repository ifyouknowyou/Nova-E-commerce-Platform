# Render configuration for NOVA Commerce
#
# Production architecture:
#
#   Vercel
#      │
#      │ /api/*
#      ▼
#   Render - nova-api
#      │
#      │ DATABASE_URL
#      ▼
#   Supabase PostgreSQL
#
# The Next.js frontend is deployed separately on Vercel.
# Do NOT deploy nova-web on Render.

services:
  # ──────────────────────────────────────────────────────────────────────────
  # NestJS API
  # ──────────────────────────────────────────────────────────────────────────
  - type: web
    name: nova-api
    env: node
    plan: free
    region: oregon

    repo: https://github.com/ifyouknowyou/nova-commerce-platform

    # Monorepo build:
    # 1. Install dependencies
    # 2. Build shared package
    # 3. Build database package (generate client only, no migrate)
    # 4. Build NestJS API
    buildCommand: >-
      npm ci &&
      npm run build -w @nova/shared &&
      npx prisma generate --schema packages/db/prisma/schema.prisma &&
      npm run build -w @nova/db &&
      npm run build -w @nova/api

    # Run migrations on every start (Render restarts on failure, so this is idempotent).
    # If migrations are already up-to-date, prisma migrate deploy is a no-op.
    startCommand: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma && node apps/api/dist/main.js

    healthCheckPath: /api/health

    autoDeployTrigger: commit

    envVars:

      # ──────────────────────────────────────────────────────────────────────
      # Runtime
      # ──────────────────────────────────────────────────────────────────────

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "4000"

      # ──────────────────────────────────────────────────────────────────────
      # Supabase PostgreSQL
      #
      # Set the REAL Supabase connection string manually in:
      # Render → nova-api → Environment
      #
      # Do NOT put the password directly in this file.
      # ──────────────────────────────────────────────────────────────────────

      - key: DATABASE_URL
        sync: false

      # ──────────────────────────────────────────────────────────────────────
      # CORS / Public URLs
      # ──────────────────────────────────────────────────────────────────────

      - key: CORS_ORIGIN
        value: "https://nova-commerce-seven.vercel.app,https://nova-commerce-henna.vercel.app"
      # ──────────────────────────────────────────────────────────────────────
      # Database seeding (manual)
      # ──────────────────────────────────────────────────────────────────────
      - key: ADMIN_PASSWORD
        sync: false

      - key: WEB_URL
        sync: false

      - key: API_URL
        sync: false

      # ──────────────────────────────────────────────────────────────────────
      # JWT
      # ──────────────────────────────────────────────────────────────────────

      - key: JWT_ACCESS_SECRET
        sync: false

      - key: JWT_REFRESH_SECRET
        sync: false

      - key: JWT_ACCESS_TTL
        value: "15m"

      - key: JWT_REFRESH_TTL
        value: "7d"

      - key: JWT_SESSION_TTL
        value: "30d"

      # ──────────────────────────────────────────────────────────────────────
      # Stripe
      # ──────────────────────────────────────────────────────────────────────

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # ──────────────────────────────────────────────────────────────────────
      # Google OAuth
      # ──────────────────────────────────────────────────────────────────────

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_CALLBACK_URL
        sync: false

      # ──────────────────────────────────────────────────────────────────────
      # Email / Resend
      # ──────────────────────────────────────────────────────────────────────

      - key: RESEND_API_KEY
        sync: false

      - key: MAIL_FROM
        value: "NOVA Commerce <no-reply@nova.local>"

      # ──────────────────────────────────────────────────────────────────────
      # S3-Compatible Object Storage (Supabase)
      # ──────────────────────────────────────────────────────────────────────
      # Prerequisites:
      #   1. Create bucket "nova-media" in Supabase Dashboard → Storage
      #   2. Set public access on the bucket
      #   3. Copy keys from Supabase Dashboard → Settings → API

      - key: S3_ENDPOINT
        value: "https://fsbhjukiofcfxhmupaui.supabase.co/storage/v1/s3"

      - key: S3_REGION
        value: "us-east-1"

      - key: S3_BUCKET
        value: "nova-media"

      # Supabase Storage S3-compatible credentials
      # NOTE: These must be set as Render secrets, not plaintext values.
      - key: S3_ACCESS_KEY
        value: ${RENDER_SECRET_S3_ACCESS_KEY}
      - key: S3_SECRET_KEY
        value: ${RENDER_SECRET_S3_SECRET_KEY}

      - key: S3_FORCE_PATH_STYLE
        value: "true"
version: "1"
services:
- type: web
  name: nova-api
  runtime: node
  repo: https://github.com/ifyouknowyou/nova-commerce-platform
  plan: free
  envVars:
  - key: PORT
    sync: false
  - key: NODE_ENV
    sync: false
  region: oregon
  buildCommand: npm ci && npm run build -w @nova/shared && npm run build -w @nova/db
    && npm run build -w @nova/api
  startCommand: node apps/api/dist/main.js
  healthCheckPath: /api/health
  autoDeployTrigger: commit

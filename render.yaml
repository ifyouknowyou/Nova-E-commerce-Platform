services:
  - type: web
    name: nova-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w @nova/shared && npm run build -w @nova/db && npm run build -w @nova/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: nova-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://nova-commerce-seven.vercel.app
      - key: API_URL
        value: https://nova-api.onrender.com
      - key: WEB_URL
        value: https://nova-commerce-seven.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
databases:
  - name: nova-db
    plan: free
    databaseName: nova_commerce

services:
  - type: web
    name: nova-api
    env: node
    plan: free
    buildCommand: npm run build -w @nova/api
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: nova-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: nova-redis
          property: connectionString
    databases:
      - name: nova-db
        plan: free
    redis:
      - name: nova-redis
        plan: free
